version: '3.8'

services:
  app:
    build: .
    container_name: perfume-app
    ports:
      - "80:8000"   # 👈 đổi sang port 80
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: perfume-db
    restart: always
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql   # 👈 giữ dữ liệu

volumes:
  db_data: